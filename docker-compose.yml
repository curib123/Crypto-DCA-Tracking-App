services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_dca}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_dca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto_dca} -d ${POSTGRES_DB:-crypto_dca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto_dca}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-crypto_dca}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGIN: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-with-google-web-client-id.apps.googleusercontent.com}
      DEFAULT_BASE_CURRENCY: ${DEFAULT_BASE_CURRENCY:-USD}
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CONTROL_PANEL_USERNAME: ${CONTROL_PANEL_USERNAME:-admin}
      CONTROL_PANEL_PASSWORD: ${CONTROL_PANEL_PASSWORD:-pass}
      CONTROL_PANEL_JWT_SECRET: ${CONTROL_PANEL_JWT_SECRET:-dev-only-control-panel-secret-change-me}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_APP_SLOT_ID: ${ADSENSE_APP_SLOT_ID:-}
      ADSENSE_LANDING_SLOT_ID: ${ADSENSE_LANDING_SLOT_ID:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_API_URL: ${MISTRAL_API_URL:-https://api.mistral.ai/v1/chat/completions}
      MISTRAL_TIMEOUT_MS: ${MISTRAL_TIMEOUT_MS:-12000}
      MISTRAL_MAX_RETRIES: ${MISTRAL_MAX_RETRIES:-1}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm --filter @crypto-dca/api prisma:generate && pnpm --filter @crypto-dca/api prisma:push && pnpm --filter @crypto-dca/api dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-replace-with-google-web-client-id.apps.googleusercontent.com}
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      API_INTERNAL_URL: http://api:4000/api
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-replace-with-google-web-client-id.apps.googleusercontent.com}
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: pnpm --filter @crypto-dca/web dev

volumes:
  postgres_data:
