name: Deploy to AWS Free Tier

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [production]

concurrency:
  group: nextfi-aws-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'production'
      )
    runs-on: ubuntu-latest
    env:
      AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
      AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
      AWS_SSH_PORT: ${{ secrets.AWS_SSH_PORT }}
      AWS_ENV_FILE: ${{ secrets.AWS_ENV_FILE }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'production' }}

    steps:
      - name: Check AWS deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for key in AWS_EC2_HOST AWS_SSH_PRIVATE_KEY AWS_ENV_FILE; do
            if [[ -z "${!key:-}" ]]; then
              echo "::warning::$key is not configured. AWS deployment will be skipped."
              missing=1
            fi
          done

          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested production revision
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Configure SSH
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/aws_key
          chmod 600 ~/.ssh/aws_key

          port="${AWS_SSH_PORT:-22}"
          ssh-keyscan -p "$port" -H "$AWS_EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Bootstrap Docker on EC2
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${AWS_SSH_PORT:-22}"
          user="${AWS_EC2_USER:-ec2-user}"

          ssh -i ~/.ssh/aws_key -p "$port"             "$user@$AWS_EC2_HOST"             'bash -s' < scripts/deploy/bootstrap-docker.sh

      - name: Prepare t4g.small memory
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${AWS_SSH_PORT:-22}"
          user="${AWS_EC2_USER:-ec2-user}"

          ssh -i ~/.ssh/aws_key -p "$port"             "$user@$AWS_EC2_HOST"             'bash -s' < scripts/aws/prepare-t4g.sh

      - name: Upload tested production source
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${AWS_SSH_PORT:-22}"
          user="${AWS_EC2_USER:-ec2-user}"

          ssh -i ~/.ssh/aws_key -p "$port"             "$user@$AWS_EC2_HOST"             'mkdir -p "$HOME/nextfi"'

          tar             --exclude='.git'             --exclude='node_modules'             --exclude='.next'             --exclude='dist'             --exclude='.env'             -czf - . |
          ssh -i ~/.ssh/aws_key -p "$port"             "$user@$AWS_EC2_HOST"             'tar -xzf - -C "$HOME/nextfi"'

      - name: Install production environment
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${AWS_SSH_PORT:-22}"
          user="${AWS_EC2_USER:-ec2-user}"

          printf '%s\n' "$AWS_ENV_FILE" |
          ssh -i ~/.ssh/aws_key -p "$port"             "$user@$AWS_EC2_HOST"             'umask 077; cat > "$HOME/nextfi/.env"; chmod 600 "$HOME/nextfi/.env"'

      - name: Deploy NextFi to EC2
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${AWS_SSH_PORT:-22}"
          user="${AWS_EC2_USER:-ec2-user}"

          ssh -i ~/.ssh/aws_key -p "$port"             "$user@$AWS_EC2_HOST"             'cd "$HOME/nextfi" && bash scripts/deploy/remote-deploy.sh'

      - name: AWS deployment not configured
        if: steps.config.outputs.ready != 'true'
        run: |
          echo "AWS CI/CD is ready, but the EC2 production secrets are not configured yet."
