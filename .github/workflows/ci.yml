name: CI

on:
  push:
    branches: [master, production]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nextfi_ci
          POSTGRES_USER: nextfi_ci
          POSTGRES_PASSWORD: nextfi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextfi_ci -d nextfi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nextfi_ci:nextfi_ci_password@localhost:5432/nextfi_ci?schema=public
      DIRECT_URL: postgresql://nextfi_ci:nextfi_ci_password@localhost:5432/nextfi_ci?sslmode=disable
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      CONTROL_PANEL_USERNAME: admin
      CONTROL_PANEL_PASSWORD: NextFi-CI-Secure-123!
      CONTROL_PANEL_JWT_SECRET: ci-control-panel-secret-at-least-32-characters
      GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      DEFAULT_BASE_CURRENCY: USD

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply Supabase migrations to CI PostgreSQL
        run: pnpm exec supabase db push --db-url "$DIRECT_URL"

      - name: Generate and validate Prisma client
        run: |
          pnpm --filter @crypto-dca/web prisma:generate
          pnpm --filter @crypto-dca/web prisma:validate

      - name: Test calculation engine
        run: pnpm --filter @crypto-dca/core test

      - name: Test PWA/offline behavior
        run: pnpm --filter @crypto-dca/web test

      - name: Typecheck workspaces
        run: pnpm typecheck

      - name: Build production app
        run: pnpm build
